################################## 网络与安全 ##################################
# 监听所有网卡，方便任意测试机器连接
bind * -::1
port 6379

# 关闭保护模式，无需密码即可直接连接
protected-mode no
# requirepass 已注释，不设密码
requirepass ss

tcp-backlog 511
timeout 0
tcp-keepalive 300

################################## 运行与日志 ##################################
# 是否以守护进程运行（如果是 Docker/K8s 部署请保持 no，如果是 Linux 裸机部署可改 yes）
daemonize no

# 日志输出到控制台，不产生日志文件
logfile ""
loglevel notice

databases 16
always-show-logo no

################################## 禁用持久化 ##################################
# 注释/清空所有 save 指令，彻底禁用 RDB 磁盘快照
# save 3600 1
# save 300 100
# save 60 10000

stop-writes-on-bgsave-error no
rdbcompression no
rdbchecksum no

# 禁用 AOF
appendonly no

################################## 内存管理 ##################################
# 建议根据你的测试机实际内存设置一个上限（如 1gb、2gb、512mb）
maxmemory 1gb

# 内存写满后自动淘汰最少使用的 Key，保证测试一直可用不报错
maxmemory-policy allkeys-lru

################################## 高级设置 ##################################
activerehashing yes
hz 10
dynamic-hz yes
